[theme]
base = "light"
primaryColor = "#FF7A00"
backgroundColor = "#FFF7EC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#FFF0DE"
textColor = "#4A3728"
linkColor = "#FF7A00"
borderColor = "#F3D9B8"
codeTextColor = "#7A5A3E"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "12px"

font = "'Baloo 2':https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
headingFont = "'Baloo 2':https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
baseFontSize = 16
baseFontWeight = 500
headingFontSizes = ["32px", "26px", "22px", "18px", "16px", "14px"]
headingFontWeights = [800, 800, 700, 700, 600, 600]
linkUnderline = false

greenColor = "#43A047"
redColor = "#E53935"
yellowColor = "#FBC02D"
orangeColor = "#FB8C00"
blueColor = "#42A5F5"
violetColor = "#8E6CC0"
grayColor = "#8D7B68"

chartCategoricalColors = [
    "#FF7A00",
    "#42A5F5",
    "#43A047",
    "#8E6CC0",
    "#E53935",
    "#FBC02D",
    "#26A69A",
    "#8D7B68",
]

chartSequentialColors = [
    "#FFF3E0",
    "#FFE0B2",
    "#FFCC80",
    "#FFB74D",
    "#FFA726",
    "#FF9800",
    "#FB8C00",
    "#F57C00",
    "#EF6C00",
    "#E65100",
]

dataframeBorderColor = "#F3D9B8"
dataframeHeaderBackgroundColor = "#FFF0DE"

[theme.sidebar]
backgroundColor = "#FFF0DC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#FFF0DE"
textColor = "#4A3728"
borderColor = "#F3D9B8"
primaryColor = "#FF7A00"
